# STATICALLY REVIEWED ONLY, never run. For a VM with a persistent disk: HTTPS via Caddy in front of OMNI.
#   docker compose -f docker-compose.vm.yml up -d --build
services:
  omni:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      FORWARDED_ALLOW_IPS: "*"   # safe here: only Caddy can reach this container; makes rate limits see real client IPs
      OMNI_ENV: production
      OMNI_DB_PATH: /data/omni.db
    volumes:
      - omni-data:/data
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - omni
    restart: unless-stopped
volumes:
  omni-data:
  caddy-data:
